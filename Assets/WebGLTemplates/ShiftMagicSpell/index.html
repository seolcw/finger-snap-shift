<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
    <title>{{{ PRODUCT_NAME }}}</title>
    <style>
      /* 960x600 창(itch.io 임베드)에 캔버스만 딱 맞게: 여백·스크롤·하단 막대 없음. 창이 커지면(전체화면) 비율을 지켜 키운다. */
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
      #unity-canvas { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: {{{ WIDTH }}}px; height: {{{ HEIGHT }}}px; background: #000; outline: none; image-rendering: pixelated; }
      #loading { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 240px; text-align: center; color: #8a90a0; font: 12px monospace; letter-spacing: 1px; }
      #loading-bar { margin-top: 8px; height: 6px; border: 1px solid #8a90a0; }
      #loading-fill { width: 0%; height: 100%; background: #3d7bff; }
      #loading-error { display: none; margin-top: 8px; color: #ff5d73; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" width={{{ WIDTH }}} height={{{ HEIGHT }}} tabindex="-1"></canvas>
    <div id="loading">
      <div>LOADING SHIFT MAGIC SPELL</div>
      <div id="loading-bar"><div id="loading-fill"></div></div>
      <div id="loading-error"></div>
    </div>
    <script src="Build/{{{ LOADER_FILENAME }}}"></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var baseWidth = {{{ WIDTH }}}, baseHeight = {{{ HEIGHT }}};

      // 창 크기에 맞춰 비율 유지(960x600 창이면 정확히 1배). 전체화면은 itch.io의 Fullscreen 버튼을 쓴다.
      function fitCanvas() {
        var scale = Math.min(window.innerWidth / baseWidth, window.innerHeight / baseHeight);
        if (!isFinite(scale) || scale <= 0) { scale = 1; }
        canvas.style.width = Math.floor(baseWidth * scale) + "px";
        canvas.style.height = Math.floor(baseHeight * scale) + "px";
      }
      window.addEventListener("resize", fitCanvas);
      fitCanvas();

      createUnityInstance(canvas, {
        arguments: [],
        dataUrl: "Build/{{{ DATA_FILENAME }}}",
        frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
        workerUrl: "Build/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
        codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      }, function (progress) {
        document.querySelector("#loading-fill").style.width = Math.round(progress * 100) + "%";
      }).then(function () {
        document.querySelector("#loading").style.display = "none";
        canvas.focus();
      }).catch(function (message) {
        var error = document.querySelector("#loading-error");
        error.style.display = "block";
        error.textContent = String(message);
      });
    </script>
  </body>
</html>
