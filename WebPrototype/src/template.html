<title>Finger Snap Shift Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
  /* 레이아웃: 위에 게임 화면 한 장, 아래에 디버그 패널 두 칸(수치 / AI 점수). 어두운 단일 테마로 고정 */
  :root {
    color-scheme: dark;
    --bg: #101218; --surface: #1a1d26; --line: #2c303c; --fg: #e6e8ee; --dim: #8f96a8;
    --accent: #ffd24a; --shift: #3d7bff; --danger: #ff4d4d;
    --font-ui: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
    --font-data: "IBM Plex Mono", Consolas, monospace;
  }
  body { background: var(--bg); color: var(--fg); font-family: var(--font-ui); padding-block: 20px;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .wrap { max-width: 1020px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; }
  h1 { font-size: 20px; margin: 0; letter-spacing: 0.02em; }
  .keys { color: var(--dim); font-size: 13px; }
  kbd { font-family: var(--font-data); font-size: 12px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 1px 5px; color: var(--fg); }
  #stage { width: 100%; max-width: 100%; height: auto; display: block; background: #14161c; border: 1px solid var(--line); border-radius: 6px; outline: none; }
  #stage:focus-visible { border-color: var(--accent); }
  .debug { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 16px; }
  @media (max-width: 720px) { .debug { grid-template-columns: minmax(0, 1fr); } }
  section { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
  h2 { font-size: 12px; margin: 0; color: var(--dim); text-transform: uppercase; letter-spacing: 0.08em; }
  .slider { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; font-size: 13px; }
  .slider output { font-family: var(--font-data); color: var(--accent); font-variant-numeric: tabular-nums; }
  .slider input { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); }
  .row { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; font-size: 13px; }
  button { font: 600 13px var(--font-ui); color: var(--fg); background: #2a2e3a; border: 1px solid var(--line); border-radius: 4px; padding: 6px 12px; cursor: pointer; }
  button:hover { background: #343947; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  pre { margin: 0; font: 12px/1.55 var(--font-data); color: var(--fg); white-space: pre; overflow-x: auto; }
  .note { color: var(--dim); font-size: 12px; margin: 0; white-space: pre-wrap; }
</style>
<div class="wrap">
  <header>
    <h1>Finger Snap Shift <span style="color:var(--dim);font-weight:500">프로토타입</span></h1>
    <span class="keys"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 또는 방향키로 이동 · <kbd>Shift</kbd>+방향키로 서 있는 줄 돌리기(<kbd>←</kbd><kbd>→</kbd> 행, <kbd>↑</kbd><kbd>↓</kbd> 열) · 목표 단어를 한 줄로 맞추면 반대편 판 슬롯에 공격 블록 · 슬롯 칸에서 <kbd>Space</kbd>로 발동 · 파란 <kbd>SHIFT</kbd> 칸을 밟으면 반대편 키보드로 · <kbd>R</kbd> 재시작</span>
  </header>
  <canvas id="stage" width="980" height="500" tabindex="0" aria-label="게임 화면"></canvas>
  <div class="debug">
    <section>
      <h2>수치 조절</h2>
      <div id="sliders" style="display:flex;flex-direction:column;gap:10px"></div>
      <div class="row">
        <label><input type="checkbox" id="dbg-invincible"> 무적</label>
        <button type="button" id="dbg-skip">페이즈 건너뛰기</button>
        <button type="button" id="dbg-restart">재시작</button>
      </div>
      <h2>글자 배치 · 단어 목록 검사</h2>
      <p class="note" id="layout-check"></p>
    </section>
    <section>
      <h2>손 AI가 매긴 공격 후보 점수</h2>
      <p class="note" id="ai-state"></p>
      <pre id="ai-scores">아직 공격을 고르지 않았어요.</pre>
      <p class="note">▶ 선택됨 · ✕ 공정성 검사 탈락 · ⏳ 쿨다운 · ↺ 같은 공격 연속 금지. 점수에는 손 이동 시간 감점이 들어 있어요.</p>
    </section>
  </div>
</div>
